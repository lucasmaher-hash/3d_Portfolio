<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lucasmaher.com</title>
  <script src="/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Roboto:wght@400;500&family=Roboto+Flex:wdth@100&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --text-tertiary: #c7c7cc;
      --accent-orange: #FF5C00;
      --border-color: #6f6f6f;

      --shadow-raised-sm: 5px 5px 12px rgba(174,174,192,0.65), -5px -5px 12px rgba(255,255,255,1);
      --shadow-raised: 8px 8px 18px rgba(174,174,192,0.65), -8px -8px 18px rgba(255,255,255,1);
      --shadow-pressed: inset 5px 5px 10px rgba(174,174,192,0.6), inset -5px -5px 10px rgba(255,255,255,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      /* clip (not hidden): prevents horizontal scroll without becoming a
         scroll container, which would break position:sticky descendants. */
      overflow-x: clip;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: 'Roboto Flex', sans-serif;
      line-height: 1.6;
      /* Fluid outer padding: full clamp() ceiling (55px) at/above 1440px,
         shrinks linearly to exactly 0 by 860px — matches the vertical
         border-removal breakpoint below, so the disappearance is continuous
         instead of jumping straight from ~25px to 0. */
      padding: 0 clamp(0px, calc(9.483vw - 81.552px), 55px);
    }

    /* Desktop-only shrink cap: once the padded/bordered layout has fully
       collapsed (below 860px), stop reflowing further — narrowing the real
       browser window just clips the extra width (no horizontal scrollbar);
       vertical scroll is unaffected. pointer:fine + hover:hover targets
       mouse/trackpad devices specifically, so actual touchscreens (phones,
       tablets) are excluded and keep reflowing normally down to their real
       widths via the existing @media (max-width: 640px) rules below. */
    @media (hover: hover) and (pointer: fine) {
      html, body { min-width: 860px; }
    }

    #top-bar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 140px;
      border: none;
      z-index: 10;
      pointer-events: auto;
      background: transparent;
      overflow: visible;
      transition: transform 300ms ease;
    }

    #top-bar.hide { transform: translateY(-220px); }

    .page-wrapper {
      padding-top: 0;
      padding-bottom: 12px;
      border: 1px solid var(--border-color);
      margin: 12px auto;
      /* Cap the content card on wide monitors; page bg fills the sides.
         Only bites above ~1550px — 13"/14" MacBooks stay edge-to-edge. */
      max-width: 1440px;
      overflow: hidden;
    }

    /* ── Hero ── */
    .hero {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      position: relative;
    }

    .hero img {
      position: absolute;
      top: -1px; left: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);   /* explicit size, not inset alone — absolutely positioned replaced elements with auto width/height ignore inset and fall back to intrinsic size */
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    /* Phones swap in vr_hero_mobile.jpg via the <picture> in the markup, and the
       box takes that image's OWN pixel ratio so it shows uncropped — per explicit
       request ("exactly the new image's aspect ratio, no crop"). With box ratio ==
       image ratio, the cover fit has nothing to cut; only the base rule's 1px
       overscan is clipped, which exists to hide the sub-pixel seam. Desktop keeps
       16/10. If the mobile image is ever re-exported at different dimensions,
       update this ratio with it. */
    @media (max-width: 640px) {
      .hero { aspect-ratio: 3213 / 2790; }
    }

    /* ── Shared section padding ── */
    .section {
      border-bottom: 1px solid var(--border-color);
      padding: clamp(32px, 5vw, 56px) clamp(40px, 8vw, 80px);
    }

    /* ── Header ── */
    .project-header { display: flex; flex-direction: column; gap: 16px; }

    .breadcrumb {
      font-family: 'VT323', monospace;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .title-row { display: flex; align-items: baseline; gap: 12px; }

    .project-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(40px, 7vw, 96px);
      line-height: 1.05;
      color: var(--text-primary);
      letter-spacing: -0.04em;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Sits ON the text baseline like a full stop. An empty flex item has no baseline
       of its own, so one is synthesised from its bottom edge — with margin-bottom 0
       that edge IS the dot's bottom, so it lands on the baseline at ANY heading size.
       The old align-items: flex-end + margin-bottom: 12px aligned to the LINE BOX
       bottom instead, and the gap from there down to the baseline is the font's
       descent, which scales with font-size — so one fixed value could only ever be
       right at one size. Measured: 7.8px BELOW the baseline on the 96px desktop
       heading, 4.2px ABOVE it on the 35px mobile one. */
    .accent-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: var(--accent-orange);
      margin-bottom: 0;
      flex-shrink: 0;
      animation: blink 1.5s step-end infinite;
    }

    .dot-divider {
      width: 100%; height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: space no-repeat;
    }

    /* ── Meta grid ── */
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(16px, 3vw, 48px);
    }

    .meta-tile {
      background: var(--bg-surface);
      border-radius: 24px;
      box-shadow: var(--shadow-raised);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 180px;
    }

    .meta-label {
      font-family: 'VT323', monospace;
      font-size: 24px;
      color: var(--accent-orange);
      text-transform: uppercase;
    }

    .meta-inset {
      flex: 1;
      background: var(--bg-surface);
      border-radius: 14px;
      padding: 14px 18px;
      box-shadow: var(--shadow-pressed);
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* ── Guide column ──────────────────────────────────────
       No border of its own — the two vertical lines framing this
       content are the existing .page-wrapper outer border. Content
       uses the same horizontal padding as every other section on the
       page (meta grid, header) so widths line up, as a single track
       instead of the multi-column grids the other pages use. */
    .guide-section {
      padding: clamp(32px, 5vw, 56px) clamp(40px, 8vw, 80px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 28px);
    }

    .guide-section:last-child { border-bottom: none; }

    .section-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      color: var(--text-primary);
      letter-spacing: -0.04em;
    }

    .step-badge {
      width: 38px; height: 38px;
      background: var(--accent-orange);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: var(--text-primary);
      flex-shrink: 0;
    }

    .guide-text {
      font-size: 14.4px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .guide-text + .guide-text { margin-top: -8px; }

    /* ── At a glance ── */
    .glance-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .glance-row {
      display: grid;
      grid-template-columns: 20px 120px 1fr;
      gap: 14px;
      align-items: baseline;
    }

    .glance-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--accent-orange);
      transform: translateY(-1px);
    }

    .glance-label {
      font-family: 'VT323', monospace;
      font-size: 17px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    .glance-value {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
    }

    @media (max-width: 640px) {
      .glance-row { grid-template-columns: 14px 1fr; }
      .glance-label { grid-column: 2; }
      .glance-value { grid-column: 2; }
      .glance-dot { grid-row: 1; }
    }

    /* ── Media block inside a guide section ── */
    .guide-media {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-pressed);
      background: #111;
    }

    .guide-media img,
    .guide-media video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Breakout image — same horizontal padding as every other section */
    .breakout-media {
      width: 100%;
      overflow: hidden;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: clamp(32px, 5vw, 56px) clamp(40px, 8vw, 80px);
    }

    .breakout-media img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      object-position: center 30%;
      display: block;
      border-radius: 16px;
      box-shadow: var(--shadow-pressed);
    }

    /* ── Reflection sections (no step badge, softer tone) ── */
    .reflection-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(22px, 3vw, 30px);
      letter-spacing: -0.03em;
      color: var(--text-primary);
    }

    .reflection-tag {
      font-family: 'VT323', monospace;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-orange);
    }

    /* ── Mobile layout ─────────────────────────────────────── */
    @media (max-width: 860px) {
      .meta-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Endpoint of the fluid shrink above: padding is already 0 by here via
       the clamp(), but the page-wrapper's own border/margin need an explicit
       cut — a 1px border can't fade gradually, so it's removed outright at
       the exact width the padding hits zero, which reads as continuous. */
    @media (max-width: 860px) {
      html, body { padding: 0; }
      .page-wrapper { margin: 0; border-left: none; border-right: none; }
      /* Keep the wrapper's border-bottom off the document's LAST row. That
         border is the final painted line in the document, and the document does
         not end on a whole pixel, so its last fraction falls outside the
         scrollable area. The pixel-snap script near the bottom of this file only
         rounds where the border STARTS; it cannot stop it being the terminal
         row, and WebKit drops that sliver outright (Chrome happens not to, which
         is why this only showed on the phone). One pixel of sill beneath the
         card demotes the border to an ordinary interior row. */
      body { padding-bottom: 1px; }
    }

    @media (max-width: 640px) {
      #top-bar { height: 140px; }
      #top-bar.hide { transform: translateY(-90px); }
      .section { padding: 24px 20px; }
      .project-title { font-size: clamp(32px, 9vw, 56px); }
      .meta-grid { grid-template-columns: 1fr 1fr; gap: 11px; }
      .meta-tile { padding: 8px; gap: 8px; height: 155px; min-height: 0; }
      .meta-inset { padding: 8px 10px; }
      .guide-section { padding: 32px 20px; }
    }

    /* ── Project nav ──────────────────────────────────────── */
    .project-nav {
      display: flex;
      border-top: 1px solid var(--border-color);
      position: relative;
      min-height: clamp(160px, 18vw, 220px);
      margin-bottom: -12px;   /* cancels .page-wrapper padding-bottom so the real border below reaches the outer card edge */
    }

    .project-nav-item + .project-nav-item {
      border-left: 1px solid var(--border-color);   /* real border on the flex item — always spans its full height, unlike an absolutely positioned divider */
    }

    .project-nav-item {
      flex: 1;
      padding: clamp(24px, 3vw, 40px) clamp(40px, 8vw, 80px);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: var(--text-primary);
    }

    /* Hover scale lives on this inner wrapper, not .project-nav-item itself —
       .project-nav-item carries the real border-left divider (see rule above),
       and scaling that element would visibly grow/shift the divider line too. */
    .project-nav-item-inner {
      display: flex;
      flex-direction: column;
      flex: 1;
      transition: transform 200ms ease;
    }

    .project-nav-item:hover .project-nav-item-inner { transform: translateY(-2px) scale(1.03); transition: transform 150ms ease; }

    .project-nav-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .project-nav-number {
      font-family: 'VT323', monospace;
      font-size: clamp(14px, 1.5vw, 18px);
      color: var(--text-secondary);
      letter-spacing: 1px;
    }

    .project-nav-label {
      font-family: 'VT323', monospace;
      font-size: clamp(14px, 1.5vw, 18px);
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .project-nav-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(20px, 3vw, 36px);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: auto;
    }

    /* ── Mobile menu overlay ───────────────────────────────── */
    .mobile-menu {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none; transition: opacity 250ms ease;
    }
    .mobile-menu.open { opacity: 1; pointer-events: auto; }
    .mobile-menu-panel {
      width: 64%;
      background: var(--bg-surface);
      border-radius: 28px;
      /* No outer shadow/highlight — a neumorphic glow would read as a halo
         against the darkened backdrop. Depth lives on the buttons inside. */
      padding: 20px; display: flex; flex-direction: column; gap: 24px;
      transform: translateY(10px); transition: transform 250ms ease;
    }
    .mobile-menu.open .mobile-menu-panel { transform: translateY(0); }
    .mobile-view-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
      background: var(--bg-surface); border-radius: 9999px;
      box-shadow: var(--shadow-raised-sm);
      padding: 5px;
    }
    /* Mobile menu only: extra breathing room under the 2D/3D toggle so it reads as
       its own control rather than as the first item of the Craft/About/Contact
       stack below it. Sits on top of the panel's uniform 24px gap.
       :first-child scopes this to the 2D/3D toggle specifically — .mobile-lang-toggle
       reuses the same .mobile-view-toggle class but is the panel's LAST child, so it
       keeps the plain 24px and the two toggles do not drift apart. */
    .mobile-menu-panel > .mobile-view-toggle:first-child { margin-bottom: 22px; }

    .mobile-mode-btn {
      border: none; background: transparent; border-radius: 9999px;
      padding: 11px 0; font-family: 'VT323', monospace; /* Matched to .mobile-nav-btn: same 22px VT323 and the same inherited 1.6
         line-height, so a segment's text box is identical to a nav button's. The
         segment keeps 11px vertical padding, which is exactly what makes the TRACK
         come out level with a nav button: the track adds its own 5px padding top and
         bottom, so 5+11 and 11+5 sum to the nav button's 16px — the two pills end up
         the same height without hardcoding one. line-height is stated explicitly
         because these are <button>s, which do not reliably inherit it. */
      font-size: 22px;
      line-height: 1.6;
      color: #555; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .mobile-mode-btn.is-active {
      /* Shared by BOTH toggles: the selected segment is a recessed well. The inset is
         --shadow-pressed's 5px offset / 10px blur reduced 35%, matching the desktop nav's
         .pill__seg.is-active in top_row_permanent_V3.html. Scoped to the segments INSIDE
         the toggle — .mobile-view-toggle's own raised track shadow is untouched, mirroring
         the desktop .pill track.
         background must be a real colour, NOT transparent: an inset shadow paints over the
         element's own background, so without one the segment would read as a hole punched
         through to the track rather than a well.
         Deliberately sets NO color — selecting a segment must not darken its text, so both
         toggles keep the base #555 and the inset alone marks the language selection. */
      background: var(--bg-surface);
      box-shadow: inset 3.25px 3.25px 6.5px rgba(174, 174, 192, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 255, 255, 1);
    }

    /* 2D/3D toggle ONLY: a flat orange fill, and explicitly NO inset — the neumorphic
       shading and white highlight are cancelled here so the orange reads as a solid pill.
       The language toggle shares .mobile-view-toggle / .mobile-mode-btn and keeps both the
       surface fill and the inset from the rule above.
       Matched on [data-mode] rather than child position or the .mobile-lang-toggle class,
       so the orange cannot wander onto the wrong control if the panel is reordered — the
       language segments carry [data-lang] instead. Specificity (0,3,0) beats the shared
       rule, so source order does not matter.
       --accent-orange is undefined on index.html (the 3D page declares no such custom
       property), hence the literal fallback. */
    .mobile-mode-btn[data-mode].is-active {
      background: var(--accent-orange, #FF5C00);
      /* Black, overriding the base rule's #555. That grey is tuned for an UNSELECTED
         segment on the grey surface; over #FF5C00 it measures 2.4:1 and the label reads
         as disabled rather than selected. Black on this orange is 6.8:1. Scoped to
         [data-mode], so the language segments keep #555 on their grey well. */
      color: #000;
      /* Same well as the language toggle above — same offsets, same blur, same
         alphas — recoloured so it reads on orange instead of on the grey
         surface. The grey/white pair was built to sit on #DCDCE3; over #FF5C00
         a white highlight desaturates to a pale wash and the cool grey shadow
         reads as dirt. So the two hues are re-derived from the orange itself:
         top-left gets a darker orange, bottom-right a lighter one, keeping the
         site's light-from-top-left convention. */
      box-shadow: inset 3.25px 3.25px 6.5px rgba(168, 56, 0, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 173, 122, 1);
    }
    .mobile-mode-btn:active:not(.is-active) {
      /* Scale is the tap feedback both toggles share. */
      transform: scale(0.96);
    }

    /* Press inset for the LANGUAGE toggle only. A tap should preview the state it lands
       in: a language segment lands in an inset well, but a 2D/3D segment now lands in a
       flat orange pill, so flashing an inset there would animate to something that no
       longer exists in that control. Same reduced spread as the settled state. */
    .mobile-mode-btn[data-lang]:active:not(.is-active) {
      box-shadow: inset 3.25px 3.25px 6.5px rgba(174, 174, 192, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 255, 255, 1);
    }
    .mobile-nav-btn {
      display: block; background: var(--bg-surface); border-radius: 9999px;
      box-shadow: var(--shadow-raised-sm);
      padding: 16px 24px; font-family: 'VT323', monospace; font-size: 22px;
      color: #555; text-transform: uppercase; text-decoration: none;
      text-align: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .mobile-nav-btn:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-pressed);
    }

    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    #scroll-track {
      position: fixed; right: 16px; top: 24px; bottom: 24px;
      width: 6px; z-index: 999; pointer-events: none;
      transform: translateZ(0); will-change: transform;
    }
    /* Mobile only: sit the scroll dots closer to the screen edge. Same
       specificity as the rule above, so this wins purely on source order —
       keep it immediately after. Desktop keeps right: 16px. */
    @media (max-width: 640px) {
      #scroll-track { right: 6px; }
    }
    #scroll-thumb {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 5px;
    }
    .scroll-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-orange, #FF5C00); display: block; flex-shrink: 0;
    }
    /* Desktop: the dot column doubles as a real scrollbar — drag the dots, or
       click the strip to jump there (macOS behaviour). The grab area is
       widened to 20px while the dots stay optically put: the extra width is
       added on the left and `right` shrinks by the same amount, so the centre
       line (19px from the edge) is unchanged.
       Touch keeps the base `pointer-events: none` — a live 20px strip down the
       screen edge would swallow swipe-scrolling on a phone. */
    @media (hover: hover) and (pointer: fine) {
      #scroll-track {
        width: 20px;
        right: 9px;            /* 16 + 6/2 = 19 centre; 19 − 20/2 = 9 */
        pointer-events: auto;
        cursor: pointer;
      }
      #scroll-thumb { cursor: grab; }
      #scroll-track.is-dragging,
      #scroll-track.is-dragging #scroll-thumb { cursor: grabbing; }
      /* Affordance: dots swell while the strip is hovered or dragged. Transform
         only — no layout shift, so the thumb's measured height never changes
         (the scroll maths reads offsetHeight). */
      .scroll-dot { transition: transform 160ms cubic-bezier(.2,.7,.2,1); }
      #scroll-track:hover .scroll-dot,
      #scroll-track.is-dragging .scroll-dot { transform: scale(1.3); }
    }

    /* ── At a glance lead paragraph (big, light) ── */
    .glance-lead {
      font-family: 'Roboto Flex', sans-serif;
      font-weight: 300;
      font-size: clamp(18px, 2.2vw, 24px);
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: var(--text-secondary);
    }

    /* ── Design-process: staggered 3D-panel renders + text ── */
    .stagger-list {
      display: flex;
      flex-direction: column;
      gap: clamp(56px, 8vw, 120px);
      margin-top: clamp(24px, 4vw, 48px);
    }

    .stagger-row {
      display: flex;
      align-items: center;
      gap: clamp(28px, 5vw, 72px);
      max-width: 860px;
    }

    /* image right, text left — pushed to the right side */
    .stagger-row.right {
      flex-direction: row-reverse;
      margin-left: auto;
    }

    /* image left, text right — indented from the left edge */
    .stagger-row.indent { margin-left: clamp(20px, 7vw, 110px); }

    .stagger-figure {
      flex: 0 0 auto;
      width: clamp(220px, 32vw, 380px);
    }

    .stagger-figure img { width: 100%; height: auto; display: block; }

    .stagger-copy {
      font-size: 14.4px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* Kicker + title + paragraph column inside a stagger row.
       NOTE: the max-width lives HERE, not on .stagger-copy where it used to, so the
       heading wraps on the same measure as the paragraph below it. Any responsive
       override of this width must target .stagger-body too — see the 17/10 block. */
    .stagger-body {
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.2vw, 14px);
      max-width: 440px;
    }


    /* Deliberately sized to match .result-subhead, NOT Unify's .feature-title
       (clamp(22px, 3vw, 34px)). These are sub-items inside a section that already has a
       .section-title at clamp(28px, 4vw, 44px), so they must stay clearly below it. */
    .feature-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    /* Process screenshots — constrained + staggered, caption above image */
    .process-shot {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 1.6vw, 20px);
    }

    .process-shot.shift-right { width: 66%; margin-left: 27%; }
    .process-shot.shift-left  { width: 80%; }


    .result-subhead {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(20px, 2.6vw, 26px);
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .result-image-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(20px, 3vw, 40px);
    }

    .result-image-pair img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: var(--shadow-pressed);
    }

    @media (max-width: 860px) {
      .stagger-row,
      .stagger-row.right,
      .stagger-row.indent {
        margin-left: 0; max-width: none; flex-direction: row;
      }
      .stagger-figure { width: clamp(160px, 34vw, 240px); }
      .process-shot.shift-right,
      .process-shot.shift-left { width: 100%; margin-left: 0; }
    }

    @media (max-width: 640px) {
      .stagger-row,
      .stagger-row.right,
      .stagger-row.indent { flex-direction: column; align-items: flex-start; gap: 18px; }
      .stagger-figure { width: clamp(180px, 60vw, 280px); }
      .result-image-pair { grid-template-columns: 1fr; }
    }

    /* Wide-aspect external monitors (wider than the 16:10 MacBook screen):
       pull the staggered rows into a centred column and enlarge the panels
       so they don't read as small and far apart. MacBook (~1.55) is untouched. */
    @media (min-width: 1600px) and (min-aspect-ratio: 17/10) {
      .stagger-list { max-width: 1180px; margin-left: auto; margin-right: auto; }
      .stagger-row { max-width: 980px; gap: clamp(48px, 5vw, 96px); }
      .stagger-row.indent { margin-left: clamp(40px, 5vw, 110px); }
      .stagger-figure { width: clamp(320px, 25vw, 460px); }
      .stagger-body { max-width: 520px; }
      .stagger-copy { font-size: 16px; }
    }
    /* ── Reduced motion (apple-design §14): drop non-essential movement,
       keep layout + opacity cues. No effect unless the OS pref is set. */
    @media (prefers-reduced-motion: reduce) {
      .accent-dot { animation: none !important; opacity: 1; }
      .machine-overlay-btn,
      .hero-blob,
      .character-row,
      .spin-scrolly .spin { animation: none !important; }
      .project-nav-item:hover .project-nav-item-inner,
      .meta-tile:hover,
      .project-tile:hover,
      .machine-frame-wrap:hover,
      .tag:hover { transform: none !important; }
    }

    /* Wide-aspect monitors only (not the ~1.6 MacBook ratio): pull the card
       in a bit more for extra breathing room. Nav keeps its own width.
       17/10 not 1.7 — Safari ignores the decimal aspect form. */
    @media (min-aspect-ratio: 17/10) {
      .page-wrapper { max-width: 1390px; }
    }

    /* ── Mobile only: readable type scale ──────────────────────────────────
       At 390px these all sat under the platform minimum — body copy was 14.4px,
       the smallest text on the page despite carrying the most reading load
       (iOS body default is 17px; Material's body-large is 16sp).
       Tiers: 16px proportional body · 15px short-but-real content (meta values)
       · 16px VT323 UI labels — VT323 has a small x-height and 1px strokes, so it
       reads ~2-3px smaller than a proportional face at the same declared size.
       MUST stay last in the stylesheet: several of these selectors already set
       font-size in earlier max-width blocks and these overrides have equal
       specificity, so they win on source order alone. */
    @media (max-width: 640px) {
      /* proportional body copy */
      .guide-text,
      .stagger-copy { font-size: 16px; }
      /* short but real content, kept below body size */
      .meta-inset { font-size: 15px; }
      /* VT323 UI labels */
      .breadcrumb { font-size: 16px; }

      /* Project nav — mobile only. The project TITLE under the label is hidden, so
         the footer reads just "NEXT >>" / "<< PREVIOUS" and the number. It is dropped
         rather than shrunk because the destination is already named by the big title
         at the top of the page you land on, and at 390px the OCR-A-BT title wrapped to
         two lines inside a box that was mostly empty anyway.
         With the title gone the label/number pair is the only content left, so it
         takes the primary (near-black) text colour instead of the secondary grey and
         a step up in size. It is NOT in the 16px VT323 group above any more: that
         size was calibrated for a secondary label sitting BELOW a title, which is no
         longer the relationship. min-height drops from clamp(160px, 18vw, 220px) —
         160px at phone widths — to 84px, which is the ~70px the remaining content
         actually occupies (24px padding x2 + one ~22px line) plus a little air. */
      .project-nav-title { display: none; }
      .project-nav-label,
      .project-nav-number { font-size: 18px; color: var(--text-primary); }
      .project-nav { min-height: 84px; }
    }
    /* Comma carriers inserted before each <br> in the meta values by the script at
       the bottom of this file. Hidden by default so DESKTOP is untouched — it keeps
       the <br> and its stacked values. The mobile block below swaps which of the two
       is visible. They are inserted unconditionally rather than only under the media
       query, which is what makes resizing across 640px work in both directions. */
    .meta-sep { display: none; }

    /* ── Mobile: meta tiles as a spec list ──────────────────────────────────────
       Replaces the 2x2 tile grid, which struggles on a phone: every tile is locked
       to height: 155px so a one-word value leaves most of its inset empty; a raised
       tile wrapping a pressed inset puts two opposing shadow systems inside a
       ~170px-wide box, which reads as noise at that size; and two columns leave each
       value ~150px wide, so dates wrap mid-phrase.
       One pressed card now holds four label/value rows, hairline-separated — same
       tokens (VT323 orange labels, --text-secondary values), no nesting, height
       driven by content.
       Appended LAST on purpose: it beats the earlier mobile rules
       (grid-template-columns + height: 155px) on source order alone, and deleting
       this block restores the previous design exactly. No markup or data-i18n
       changes are involved. */
    @media (max-width: 640px) {
      .meta-grid {
        display: flex;
        flex-direction: column;
        gap: 0;
        background: var(--bg-surface);
        border-radius: 24px;
        /* Pressed, not raised: the card reads as a recess holding the rows. Same
           token the old per-tile .meta-inset panels used — the depth just moved from
           four small insets to one big one. */
        box-shadow: var(--shadow-pressed);
        padding: 6px 18px;
      }

      .meta-tile {
        display: grid;
        /* 88px fits the widest label in either language — measured at 18px VT323 the
           longest is "Fähigkeiten" at 80px. Fixed rather than auto because each tile
           is its own grid, so an auto track would size per row and the values would
           not line up with each other. */
        grid-template-columns: 88px 1fr;
        align-items: start;
        gap: 14px;
        height: auto;
        min-height: 0;
        padding: 14px 0;
        background: none;
        border-radius: 0;
        box-shadow: none;
      }

      /* A real border on a full-width row spans it exactly — no pseudo-element
         offsets to get wrong, and no dotted-divider JS to wire up (the site's
         .dot-divider needs a measured exact-divisor script to avoid half dots). */
      .meta-tile + .meta-tile {
        border-top: 1px solid rgba(111, 111, 111, 0.18);
      }

      .meta-label {
        font-size: 18px;
        line-height: 1.25;
      }

      /* Values run inline, comma-separated, instead of one per line. Hiding the <br>
         un-breaks them; the comma itself is a real .meta-sep node inserted by the
         script at the bottom of this file. That split is necessary, not incidental —
         measured in Blink:
           · br{display:none} / br{display:contents} -> one line, but the runs merge
             into "FigmaPrototypingClaude Code" with nothing between them;
           · br::after{content:", "}                 -> adds 0px, i.e. generated
             content on a <br> never renders;
           · <br> as a flex item                     -> still forces the break.
         So CSS alone cannot supply the comma. */
      .meta-inset {
        flex: none;
        padding: 0;
        background: none;
        border-radius: 0;
        box-shadow: none;
        line-height: 1.5;
      }

      .meta-inset br { display: none; }
      .meta-sep { display: inline; }
    }

    /* ══ Mobile content pass ═══════════════════════════════════════════
       PHONES ONLY — see the identical block on the other project pages.
       Desktop is untouched: everything is inside max-width: 640px.

       ONE COLUMN, ONE WIDTH. .stagger-figure was 234px on a 390px screen
       while the .process-shot stills around it filled the full 350px
       content column; that mix of edges is what made the page read as a
       squeezed desktop layout. All media now shares the column's edges.
       .result-image-pair is already single-column at this width. */
    @media (max-width: 640px) {
      .stagger-figure { width: 100%; }
      .stagger-row,
      .stagger-row.right,
      .stagger-row.indent { gap: 20px; }
      .process-shot,
      .guide-media { width: 100%; margin-left: 0; margin-right: 0; }
    }
  
    /* Keyword emphasis for skimming (Hanwha-style). Inert by default — the <b>
       must not bold or recolor anything on desktop, which stays as designed;
       the mobile block below is what turns the ink darker. */
    b.kw { font-weight: inherit; color: inherit; }

    /* ── Mobile breathing room (design pass, 2026-07-31) ─────────────────
       Appended LAST so it wins every earlier ≤640px rule on source order.
       References: tianqicraft.com (section rhythm: hairline dividers with
       generous symmetric air), junhyungpark.com/hanwha (grey body text with
       darker keywords for skimming; media never crowded by text).
       Measured before: sections met their border with 32px each side, body
       paragraphs sat 12px apart, divider→body 20px. */
    @media (max-width: 640px) {
      /* Section rhythm: 64px → 104px border-to-border. */
      .guide-section { padding: 52px 20px; }
      /* Header/glance/meta blocks: slighter bump, they are shorter units. */
      .section { padding: 32px 20px; }

      /* The heading + divider stay one tight unit (20px); the air goes below
         the divider, before the body. */
      .guide-section .dot-divider,
      .section .dot-divider { margin-bottom: 12px; }

      /* Paragraph gap 12px → 20px: the base sheet pulls consecutive
         paragraphs together with -8px; on a phone that reads as one slab. */
      .guide-text + .guide-text { margin-top: 0; }

      /* Endergebnis: the two demo units separate more than their internals
         (52px → 76px). Only subheads FOLLOWING content — the first subhead
         after the divider keeps its existing 84px. */
      .guide-text + .result-subhead { margin-top: 24px; }

      /* Skim keywords: darker grey ink, weight unchanged (only wght 400 is
         loaded here; synthetic bold renders muddy on this face). */
      b.kw { color: #4a4a52; }
      /* The At-a-Glance lead reads as the project's one-paragraph pitch — full
         primary ink, no partial highlights (they were unwrapped from this key). */
      .glance-lead { color: var(--text-primary); }

      /* The three silver-panel renders: 65% width (35% smaller) and staggered —
         first left, second right, third centred. This deliberately reverses the
         earlier "one column, one width" rule that squared them off against the
         text column: that rule exists to stop MIXED media edges reading as a
         squeezed desktop layout, but these three are a set, and alternating which
         edge each hangs off is how a single column expresses the desktop stagger.
         The .process-shot stills below them still fill the column, so the two
         groups stay visually distinct rather than merely inconsistent.
         align-self, not margin: .stagger-row is a flex COLUMN at this width, so
         cross-axis alignment is the honest lever — and it moves only the figure,
         leaving each caption on the left where it reads from. */
      .stagger-figure { width: 65%; }
      .stagger-row .stagger-figure        { align-self: flex-start; }
      .stagger-row.right .stagger-figure  { align-self: flex-end; }
      .stagger-row.indent .stagger-figure { align-self: center; }
    }
    /* Mobile: neumorphic shadow spread/radius reduced 35% (offsets & blur ×0.65),
       matching the nav's 2D/3D toggle segment. Redefining only the tokens keeps
       desktop untouched; every var(--shadow-*) user inherits this automatically. */
    @media (max-width: 640px) {
      :root {
        --shadow-raised-sm: 3.25px 3.25px 7.8px rgba(174,174,192,0.65), -3.25px -3.25px 7.8px rgba(255,255,255,1);
        --shadow-raised: 5.2px 5.2px 11.7px rgba(174,174,192,0.65), -5.2px -5.2px 11.7px rgba(255,255,255,1);
        --shadow-pressed: inset 3.25px 3.25px 6.5px rgba(174,174,192,0.6), inset -3.25px -3.25px 6.5px rgba(255,255,255,1);
      }
    }
  </style>
</head>
<body>
  <iframe id="top-bar" src="/top_row_permanent_V3.html" allowtransparency="true" scrolling="no"></iframe>

  <div id="mobile-menu" class="mobile-menu">
    <div class="mobile-menu-panel">
      <a class="mobile-nav-btn" data-page="craft" data-i18n="menu-craft">Craft</a>
      <a class="mobile-nav-btn" data-page="about" data-i18n="menu-about">About</a>
      <a class="mobile-nav-btn" data-page="contact" data-i18n="menu-contact">Contact</a>
      <!-- Language toggle. Deliberately the SAME component as the 2D/3D toggle
           above — same two classes, no styling of its own — so the pair can
           never drift apart. The nav bar's own de/en text is hidden below
           640px; this replaces it. -->
      <div class="mobile-view-toggle mobile-lang-toggle">
        <button class="mobile-mode-btn" data-lang="de">Deutsch</button>
        <button class="mobile-mode-btn" data-lang="en">English</button>
      </div>
    </div>
  </div>

  <div class="page-wrapper">

    <!-- Header. No .hero on this page yet: with no hero element at all, the nav
         bar takes its "no hero → raised shadow always on" branch, which is the
         correct treatment for a page that does not open on a full-bleed image. -->
    <div class="section" style="border-bottom: none;">
      <div class="project-header">
        <p class="breadcrumb" data-i18n-html="breadcrumb">Portfolio&nbsp;&nbsp;/&nbsp;&nbsp;Projects&nbsp;&nbsp;/&nbsp;&nbsp;To Shove</p>
        <div class="title-row">
          <h1 class="project-title">To Shove</h1>
          <span class="accent-dot"></span>
        </div>
        <div class="dot-divider"></div>
      </div>
    </div>

    <!-- CONTENT GOES HERE — deliberately empty for now.
         The page keeps the full shared chrome (nav, mobile menu, scroll dots,
         dot-divider sizing, ?from=3d Exit pill, i18n) so sections can be dropped
         in without wiring anything up first. Build it out with the shared
         pattern: At a Glance → meta grid → Overview/Process → result. -->
    <div class="guide-section">
      <p class="guide-text" data-i18n="placeholder">[ Placeholder ]</p>
    </div>

    <div class="project-nav">
      <a href="/virtual_cooking2d.html" class="project-nav-item">
        <div class="project-nav-item-inner">
          <div class="project-nav-top">
            <span class="project-nav-number">02</span>
            <span class="project-nav-label" data-i18n="nav-prev">&lt;&lt; PREVIOUS</span>
          </div>
          <span class="project-nav-title">Virtual Cooking</span>
        </div>
      </a>
      <a href="/kaffeemaschine2d.html" class="project-nav-item" style="text-align: right;">
        <div class="project-nav-item-inner">
          <div class="project-nav-top">
            <span class="project-nav-label" data-i18n="nav-next">NEXT &gt;&gt;</span>
            <span class="project-nav-number">04</span>
          </div>
          <span class="project-nav-title" data-i18n="nav-cybercoffee">Cybercoffee</span>
        </div>
      </a>
    </div>

  </div>

  <script>
    // ── Page transitions ──────────────────────────────────────────
    (function() {
      var KF = '@keyframes _sR{from{transform:translateX(100%)}to{transform:translateX(0)}}@keyframes _sL{from{transform:translateX(-100%)}to{transform:translateX(0)}}';
      var s = document.createElement('style'); s.textContent = KF; document.head.appendChild(s);
      var DUR = 380, EASE = 'cubic-bezier(0.4,0,0.2,1)';

      function _getWrap() {
        var w = document.getElementById('_sw');
        if (!w) {
          w = document.createElement('div'); w.id = '_sw';
          Array.from(document.body.children).forEach(function(c) {
            if (c.id !== 'top-bar' && c.id !== '_sw') w.appendChild(c);
          });
          document.body.appendChild(w);
        }
        return w;
      }

      var _rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var dir = sessionStorage.getItem('_sv');
      if (dir) sessionStorage.removeItem('_sv');
      if (dir && !_rm) {
        var wrap = _getWrap();
        wrap.style.transform = dir === 'right' ? 'translateX(100%)' : 'translateX(-100%)';
        var done = false;
        function reveal() {
          if (done) return; done = true;
          requestAnimationFrame(function() {
            wrap.style.transform = '';
            wrap.style.animation = (dir === 'right' ? '_sR' : '_sL') + ' ' + DUR + 'ms ' + EASE + ' both';
            setTimeout(function() { wrap.style.animation = ''; }, DUR + 60);
          });
        }
        if (document.fonts && document.fonts.ready) { document.fonts.ready.then(reveal); } else { requestAnimationFrame(function() { requestAnimationFrame(reveal); }); }
        setTimeout(reveal, 300);
      }

      window._nav = function(url, into) {
        sessionStorage.setItem('_sv', into);
        var dim = document.createElement('div');
        dim.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0);z-index:9999;transition:background 220ms ease;pointer-events:none;';
        document.body.appendChild(dim);
        requestAnimationFrame(function() { dim.style.background = 'rgba(0,0,0,0.28)'; });
        setTimeout(function() { location.href = url; }, 220);
      };

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'page-slide') window._nav(e.data.url, e.data.enterFrom);
      });
    })();

    (function () {
      const menu = document.getElementById('mobile-menu');
      /* The mobile menu is an opaque neumorphic panel using the site's own
         surface colour and shadow tokens, so it no longer adapts its shading
         to the page behind it (that was needed only for the old glass look). */
      function openMenu()  { menu.classList.add('open'); }
      function closeMenu() { menu.classList.remove('open'); }
      window.addEventListener('message', e => {
        if (e.data.type === 'mobile-menu-toggle')
          menu.classList.contains('open') ? closeMenu() : openMenu();
      });
      menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });
      menu.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.mode === '3d') {
            // _enter3d: deliberate switch to 3D — see the "/" guard in index.html
            try { sessionStorage.setItem('_enter3d', '1'); } catch (e) {}
            window._nav('/', 'right');
          }
          else window.location.href = '/2D.html';
        });
      });
      menu.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault(); closeMenu();
          if      (btn.dataset.page === 'craft')   window.location.href = '/2D.html#craft-section';
          else if (btn.dataset.page === 'about')   window.location.href = '/about2d.html';
          else if (btn.dataset.page === 'contact') window.location.href = '/contact2d.html';
        });
      });

      // Language toggle. It does NOT translate this page directly — it writes
      // the preference and hands the change to the nav iframe, which is already
      // the site's single owner of language and broadcasts 'lang-change' back to
      // the handler this page has always had. One path, so nothing desyncs.
      const langBtns = menu.querySelectorAll('[data-lang]');
      function markLang(l) {
        langBtns.forEach(b => b.classList.toggle('is-active', b.dataset.lang === l));
      }
      // Seed the highlight synchronously; the nav also broadcasts the stored
      // language ~100ms after it loads, which corrects a stale value (e.g. an
      // old 'fr' preference, which the nav rewrites to 'en').
      try { markLang(localStorage.getItem('lang') || 'de'); } catch (e) { markLang('de'); }
      langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const l = btn.dataset.lang;
          try { localStorage.setItem('lang', l); } catch (e) {}
          markLang(l);
          const bar = document.getElementById('top-bar');
          if (bar && bar.contentWindow) bar.contentWindow.postMessage({ type: 'lang-change', lang: l }, '*');
        });
      });
      window.addEventListener('message', e => {
        if (e.data && e.data.type === 'lang-change') markLang(e.data.lang);
      });
    })();

    let lastScrollY = 0;
    let lastToggleY = 0;
    const topBar = document.getElementById('top-bar');
    const hideThreshold = 250;
    const showThreshold = 180;

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY === 0) {
        topBar.classList.remove('hide');
        lastToggleY = 0;
      } else if (currentScrollY > lastScrollY && Math.abs(currentScrollY - lastToggleY) > hideThreshold) {
        topBar.classList.add('hide');
        lastToggleY = currentScrollY;
      } else if (currentScrollY < lastScrollY && Math.abs(currentScrollY - lastToggleY) > showThreshold) {
        topBar.classList.remove('hide');
        lastToggleY = currentScrollY;
      }
      lastScrollY = currentScrollY;
    });

    // ── i18n ─────────────────────────────────────────────────────
    const TRANSLATIONS = {
      en: {
        'menu-craft': 'Craft', 'menu-about': 'About', 'menu-contact': 'Contact',
        'breadcrumb': 'Portfolio&nbsp;&nbsp;/&nbsp;&nbsp;Projects&nbsp;&nbsp;/&nbsp;&nbsp;To Shove',
        'placeholder': '[ Placeholder ]',
        'nav-prev': '<< PREVIOUS', 'nav-next': 'NEXT >>',
        'nav-cybercoffee': 'Cybercoffee',
      },
      de: {
        'menu-craft': 'Projekte', 'menu-about': 'Über mich', 'menu-contact': 'Kontakt',
        'breadcrumb': 'Portfolio&nbsp;&nbsp;/&nbsp;&nbsp;Projekte&nbsp;&nbsp;/&nbsp;&nbsp;To Shove',
        'placeholder': '[ Platzhalter ]',
        'nav-prev': '<< ZURÜCK', 'nav-next': 'WEITER >>',
        'nav-cybercoffee': 'Cybercoffee',
      }
    };
    function applyLang(lang) {
      const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
      document.querySelectorAll('[data-i18n]').forEach(el => { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { if (t[el.dataset.i18nHtml] !== undefined) el.innerHTML = t[el.dataset.i18nHtml]; });
    }
    applyLang(localStorage.getItem('lang') || 'de');

    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      if (e.data.type === 'nav-expand') topBar.style.height = '400px';
      if (e.data.type === 'nav-collapse') topBar.style.height = '140px';
      if (e.data.type === 'lang-change') applyLang(e.data.lang);
    });
  </script>
  <div id="scroll-track">
    <div id="scroll-thumb">
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
    </div>
  </div>
  <script>
    (function () {
      var thumb = document.getElementById('scroll-thumb');
      var track = document.getElementById('scroll-track');
      var ticking = false;
      function maxScroll() {
        return document.documentElement.scrollHeight - window.innerHeight;
      }
      function travel() { return track.offsetHeight - thumb.offsetHeight; }
      function update() {
        var max = maxScroll();
        var progress = max > 0 ? Math.max(0, Math.min(1, window.scrollY / max)) : 0;
        thumb.style.top = (progress * travel()) + 'px';
        ticking = false;
      }
      window.addEventListener('scroll', function () {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      update();

      /* ── Draggable, macOS-style ───────────────────────────────────────
         Drag the dot column to scrub, or click the bare strip to jump there.
         Desktop only, enforced in CSS rather than here: the base rule leaves
         pointer-events off and only the (hover: hover) and (pointer: fine)
         block turns it on, so on a phone these listeners can never fire and
         cannot swallow a swipe.
         Pointer capture is what makes the drag survive the pointer leaving the
         20px strip — without it, moving sideways mid-drag would drop it. */
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var grabOffset = 0;   // where inside the thumb it was grabbed, so it doesn't jump on grab
      var dragging = false;

      function scrollToThumbTop(top, smooth) {
        var t = travel();
        var progress = t > 0 ? Math.max(0, Math.min(1, top / t)) : 0;
        window.scrollTo({ top: progress * maxScroll(), behavior: smooth ? 'smooth' : 'auto' });
      }

      track.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        if (thumb.contains(e.target)) {
          grabOffset = e.clientY - thumb.getBoundingClientRect().top;
        } else {
          // Bare strip: centre the thumb on the pointer and go there, matching
          // macOS's "jump to the spot that's clicked".
          grabOffset = thumb.offsetHeight / 2;
          scrollToThumbTop(e.clientY - track.getBoundingClientRect().top - grabOffset, !reduceMotion);
        }
        dragging = true;
        track.classList.add('is-dragging');
        track.setPointerCapture(e.pointerId);
        e.preventDefault();   // no text selection while dragging
      });

      track.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        // Never smooth here: the scroll must track the pointer 1:1, and a
        // queued smooth scroll would lag a frame behind every move.
        scrollToThumbTop(e.clientY - track.getBoundingClientRect().top - grabOffset, false);
      });

      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('is-dragging');
        try { track.releasePointerCapture(e.pointerId); } catch (err) {}
      }
      track.addEventListener('pointerup', endDrag);
      track.addEventListener('pointercancel', endDrag);
    })();
  </script>

  <script>
    // Dot-divider exact-tiling fix: background-repeat:space is unreliable on
    // gradient backgrounds in Safari (last dot can render half-clipped even
    // though space is supposed to guarantee whole tiles). Root-cause fix:
    // measure each divider's real width in JS and set background-size to an
    // EXACT integer divisor of it, so there is no remainder tile left for
    // any browser's tiling engine to mishandle.
    (function () {
      function fixDotDividers() {
        document.querySelectorAll('.dot-divider').forEach(function (el) {
          var w = el.offsetWidth;
          if (!w) return;
          var count = Math.max(2, Math.round(w / 10));
          var tile = w / count;
          el.style.backgroundSize = tile + 'px 4px';
          el.style.backgroundRepeat = 'repeat-x';
        });
      }
      var raf;
      function scheduleFix() {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(fixDotDividers);
      }
      document.addEventListener('DOMContentLoaded', scheduleFix);
      window.addEventListener('load', scheduleFix);
      window.addEventListener('resize', scheduleFix);
    })();
  </script>
  <script>
    // Mobile only: pixel-snap the card's BOTTOM border.
    //
    // .page-wrapper's border-bottom is the last painted row of the entire document, and
    // the document does not end on a whole pixel. Measured on a 390px phone: the
    // wrapper's border-box bottom sits at y = 5585.078 while documentElement.scrollHeight
    // is 5585 — so the final 0.078px of that 1px border falls outside the scrollable
    // area. .project-nav's border-top, the line at the TOP of the same section, has
    // ordinary content above and below it and sits at no boundary at all. That asymmetry
    // is why only the bottom line reads as thin/clipped. Blink happens to snap both to a
    // clean 3 device rows (verified at DPR 3: identical ink, 328.5 each), so this does
    // NOT reproduce in Chrome — WebKit is under no obligation to make the same choice.
    //
    // Fix: measure the real fractional bottom and grow padding-bottom by exactly enough
    // to land it on a whole CSS pixel, so the border fills an exact device-pixel band
    // with nothing hanging past the end of the document. Same measure-then-set approach
    // as the dot-divider fix above, and for the same reason: a static CSS value cannot
    // know where the box happens to land. The added padding is always < 1px, and it sits
    // below .project-nav (whose -12px margin cancels the base 12px), so nothing moves
    // visibly.
    //
    // Desktop is untouched — outside the mobile query the inline value is cleared and
    // the stylesheet's own padding-bottom applies.
    (function () {
      var wrap = document.querySelector('.page-wrapper');
      if (!wrap) return;
      var mq = window.matchMedia('(max-width: 640px)');
      function snap() {
        wrap.style.paddingBottom = '';        // always measure against the CSS value
        if (!mq.matches) return;              // desktop: leave the stylesheet alone
        var bottom = wrap.getBoundingClientRect().bottom + window.pageYOffset;
        var delta = Math.ceil(bottom) - bottom;
        if (delta > 0.002) {
          var base = parseFloat(getComputedStyle(wrap).paddingBottom) || 0;
          wrap.style.paddingBottom = (base + delta).toFixed(3) + 'px';
        }
      }
      var raf;
      function scheduleSnap() { cancelAnimationFrame(raf); raf = requestAnimationFrame(snap); }
      document.addEventListener('DOMContentLoaded', scheduleSnap);
      window.addEventListener('load', scheduleSnap);
      window.addEventListener('resize', scheduleSnap);
      if (mq.addEventListener) mq.addEventListener('change', scheduleSnap);
    })();
  </script>

  <script>
    // 3D-scene entry point: ?from=3d (set by the click handler in src/main.js
    // when a scene object navigates here) hides the usual nav bar and shows
    // a fixed "Exit" pill (top-left) that returns to the 3D scene instead.
    (function () {
      if (new URLSearchParams(location.search).get('from') !== '3d') return;
      var topBarEl = document.getElementById('top-bar');
      if (topBarEl) topBarEl.style.display = 'none';
      // A 3D-scene click is only meant to open this ONE project page — no
      // hopping to other projects from here — so the prev/next footer nav
      // is hidden too. Untouched when the page is opened normally from 2D.
      var projectNavEl = document.querySelector('.project-nav');
      if (projectNavEl) projectNavEl.style.display = 'none';
      var style = document.createElement('style');
      // Both shadows are gated on .is-raised — see updateExitShadow() below.
      // The transform lift is NOT gated: it works on any background.
      style.textContent = '.exit-3d-btn{position:fixed;top:24px;left:24px;z-index:10000;background:var(--bg-surface);border:none;border-radius:9999px;padding:10px 24px;font-family:"VT323",monospace;font-size:16px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-primary);box-shadow:none;cursor:pointer;text-decoration:none;transition:left 200ms ease, transform 150ms ease, box-shadow 260ms cubic-bezier(.2,.7,.2,1);}.exit-3d-btn.is-raised{box-shadow:var(--shadow-raised-sm);}.exit-3d-btn:hover{transform:translateY(-2px) scale(1.03);transition:left 200ms ease, transform 150ms ease, box-shadow 150ms ease;}.exit-3d-btn.is-raised:hover{box-shadow:11px 11px 24px rgba(174,174,192,0.9), -8px -8px 20px rgba(255,255,255,1);}';
      style.textContent += /* keyframes start AND end in the :hover pose: an animation replaces the
         whole transform, so plain scale(1) frames made the button first DROP
         out of its hover lift on click. The mouse is on the button when this
         runs, so the hover pose is the correct base in every frame. */
      '@keyframes exitPop{0%{transform:translateY(-2px) scale(1.03)}50%{transform:translateY(-2px) scale(1.15)}100%{transform:translateY(-2px) scale(1.03)}}';
      document.head.appendChild(style);
      var btn = document.createElement('a');
      btn.href = '/';
      btn.className = 'exit-3d-btn';
      btn.textContent = 'Exit';
      document.body.appendChild(btn);

      // Same button-pop as the 3D scene objects: pulse ~0.28s, THEN navigate.
      // The deliberate delay is what makes the press visible before the page
      // leaves — without it the pulse would be cut off by the navigation.
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        if (btn.dataset.leaving) return;   // double-click guard
        btn.dataset.leaving = '1';
        btn.style.animation = 'exitPop 280ms ease';
        setTimeout(function () { window.location.href = btn.getAttribute('href'); }, 280);
      });

      // An iOS forward-swipe back into this page restores it from the
      // back-forward cache with `leaving` still set, which leaves the pill
      // permanently dead. Same latched-guard bug as the 3D scene's
      // popNavigating; `persisted` is the only signal a bfcache restore gives.
      window.addEventListener('pageshow', function (e) {
        if (!e.persisted) return;
        delete btn.dataset.leaving;
        btn.style.animation = '';
      });

      // Keep the button clear of .page-wrapper's left border. It CENTRES in the
      // open margin between the viewport edge and that border, capped at
      // MARGIN_GAP so wide monitors don't push it far from the corner; if the
      // margin is too tight for the pill to breathe, it tucks just inside the
      // frame instead of letting the border cut across it.
      //
      // Centring rather than a fixed offset is what fixes MacBook widths: at
      // 1440–1512 the margin is 110px and the pill 76px, so a flat 34px put its
      // right edge at exactly 110 — touching the border, with the raised
      // shadow (5px offset + 12px blur ≈ 17px) spilling over it. Centring
      // leaves 17px either side, which is precisely the room that shadow needs.
      // Above ~1700px the cap takes over and the position is unchanged.
      function positionExitBtn() {
        var wrapper = document.querySelector('.page-wrapper');
        if (!wrapper) return;
        var wrapperLeft = wrapper.getBoundingClientRect().left;
        var btnWidth    = btn.offsetWidth;
        var MARGIN_GAP  = 34;   // cap: furthest from the viewport edge it may sit
        var INSET_GAP   = 26;   // fallback: tucked just inside the frame
        var MIN_SIDE    = 14;   // least breathing room wanted on each side
        var margin = wrapperLeft - btnWidth;   // free space beside the frame
        btn.style.left = (margin >= MIN_SIDE * 2)
          ? Math.min(MARGIN_GAP, margin / 2) + 'px'
          : (wrapperLeft + INSET_GAP) + 'px';
      }
      positionExitBtn();
      window.addEventListener('resize', positionExitBtn);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(positionExitBtn);

      // A neumorphic shadow only reads correctly over the page's own surface
      // colour — anywhere else the white highlight and grey shadow become a
      // glowing halo. So the pill drops both shadows whenever something other
      // than that surface is behind it.
      //
      // This asks what is ACTUALLY PAINTED behind the button rather than
      // intersecting rectangles with a list of selectors. Two earlier versions
      // failed because the list was never complete: a hero-only test left the
      // halo on over the process shots further down, and a '.hero, img, video'
      // test still missed Unify's colour-palette swatches, which are plain divs
      // with a background-colour — the button sat glowing on a hot pink square.
      // Hit-testing has no such list to keep up to date: an image, a video, a
      // dark hero container and a coloured div all register the same way.
      var EXIT_SAMPLES = 3;   // 3x3 grid. Coverage lands in ninths, which
                              // straddles the 50% threshold cleanly: 4/9 = 44%,
                              // 5/9 = 56%, so there is no exact-tie flicker.

      // What paints at this point, ignoring the button itself. Walks DOWN the
      // stack past anything transparent, because the surface-coloured section
      // wrappers are usually several levels below whatever sits on top.
      function exitPaintAt(x, y) {
        var stack = document.elementsFromPoint(x, y);
        for (var i = 0; i < stack.length; i++) {
          var el = stack[i];
          if (el === btn || btn.contains(el)) continue;
          var tag = el.tagName;
          if (tag === 'IMG' || tag === 'VIDEO' || tag === 'CANVAS') return 'media';
          var cs = getComputedStyle(el);
          // A real bitmap counts; a CSS gradient does not — the only gradients
          // here are the .dot-divider rules, which are decoration ON the surface.
          if (cs.backgroundImage.indexOf('url(') === 0) return 'media';
          var bg = cs.backgroundColor;
          if (!bg || bg === 'transparent' || bg === 'rgba(0, 0, 0, 0)') continue;
          return bg;
        }
        return null;   // nothing opaque found — the page background shows through
      }

      function updateExitShadow() {
        var b = btn.getBoundingClientRect();
        if (!b.width || !b.height) return;
        var surface = getComputedStyle(document.body).backgroundColor;
        var covered = 0, total = EXIT_SAMPLES * EXIT_SAMPLES;
        for (var iy = 0; iy < EXIT_SAMPLES; iy++) {
          for (var ix = 0; ix < EXIT_SAMPLES; ix++) {
            var paint = exitPaintAt(
              b.left + b.width  * (ix + 0.5) / EXIT_SAMPLES,
              b.top  + b.height * (iy + 0.5) / EXIT_SAMPLES
            );
            if (paint !== null && paint !== surface) covered++;
          }
        }
        btn.classList.toggle('is-raised', covered <= total * 0.5);
      }

      // rAF-throttled: nine hit tests plus a getComputedStyle walk per sample is
      // real work, so it must not run more than once per frame during a scroll.
      var exitTick = false;
      function requestExitShadow() {
        if (exitTick) return;
        exitTick = true;
        requestAnimationFrame(function () { exitTick = false; updateExitShadow(); });
      }
      window.addEventListener('scroll', requestExitShadow, { passive: true });
      window.addEventListener('resize', requestExitShadow, { passive: true });
      // Images that arrive late change what is behind the button without any
      // scroll happening, so re-check on load as well as on these timers.
      window.addEventListener('load', updateExitShadow);
      updateExitShadow();
      requestAnimationFrame(updateExitShadow);
      setTimeout(updateExitShadow, 120);
      setTimeout(updateExitShadow, 500);
    })();
  </script>

  <script>
    /* Insert a comma carrier before every <br> in the meta values.
       Needed because CSS cannot supply that comma: a <br> can be un-broken with
       display:none/contents, but generated content on a <br> renders nowhere in
       Blink or WebKit (measured: br::after adds 0px), and as a flex item it still
       forces the break. So the separator has to be a real node.
       Deliberately NOT gated on the viewport: the nodes are always present and
       `.meta-sep { display: none }` hides them on desktop, so resizing across 640px
       works in both directions with no JS involvement.
       The MutationObserver is required, not defensive — the i18n layer reassigns
       innerHTML from TRANSLATIONS on every language switch, which drops the carriers
       and restores the raw <br>s. It self-terminates: after a pass every <br>
       already has a carrier, so the guard makes the next callback a no-op. */
    (function () {
      var insets = document.querySelectorAll('.meta-inset');
      if (!insets.length) return;

      function addSeps(el) {
        el.querySelectorAll('br').forEach(function (br) {
          var prev = br.previousSibling;
          if (prev && prev.nodeType === 1 && prev.classList.contains('meta-sep')) return;
          var before = (prev && prev.nodeType === 3) ? prev.textContent.replace(/\s+$/, '') : '';
          var sep = document.createElement('span');
          sep.className = 'meta-sep';
          /* A comma is wrong where the text already ends in punctuation that joins
             the two halves — Timeline reads "May 2026 —" / "Jul 2026", which a comma
             turns into "May 2026 —, Jul 2026". Fall back to a plain space there. */
          sep.textContent = /[—–,;:/-]$/.test(before) ? ' ' : ', ';
          br.parentNode.insertBefore(sep, br);
        });
      }

      insets.forEach(function (el) {
        addSeps(el);
        new MutationObserver(function () { addSeps(el); })
          .observe(el, { childList: true });
      });
    })();
  </script>
