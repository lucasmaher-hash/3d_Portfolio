<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wdth@100&display=swap" rel="stylesheet" />
  <link href="/fonts/roboto-flex-ui.css" rel="stylesheet" />
  <style>
    :root {
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --shadow-raised-sm:
         5px  5px 12px rgba(174,174,192,0.65),
        -5px -5px 12px rgba(255,255,255,1);
      --ease: cubic-bezier(.2,.7,.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }

    .floating-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bg-surface);
      box-shadow: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Roboto Flex UI', 'Roboto Flex', sans-serif; font-size-adjust: 0.4;
      font-size: 18px;
      color: var(--text-primary);
      text-decoration: none;
      border: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 260ms var(--ease);
      -webkit-tap-highlight-color: transparent;
      z-index: 100;
    }

    .floating-button:hover {
      transform: translateY(-2px) scale(1.03);
      transition: transform 150ms ease;
    }
  </style>
</head>
<body>
  <button class="floating-button" aria-label="Button">?</button>
  <script>
    document.querySelector('.floating-button').addEventListener('click', () => {
      window.parent.postMessage({ type: 'openControls' }, '*')
    })
  </script>
</body>
</html>
