<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-base: #DCDCE3;
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --accent-orange: #FF5C00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--bg-base); font-family: 'VT323', monospace; padding: 32px; display: flex; justify-content: center; }

    .container {
      width: min(100%, 804px);
      max-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(32px, 5vw, 64px) clamp(32px, 8vw, 80px);
      gap: 16px;
      border: 1px solid #6f6f6f;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(36px, 5.6vw, 56px);
      color: var(--text-primary);
      letter-spacing: 6px;
    }

    .header-divider {
      width: 100%;
      height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: space no-repeat;
      border: none;
    }

    .contact-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: clamp(16px, 3vw, 40px);
    }

    .contact-item {
      background: var(--bg-surface);
      border-radius: 999px;
      box-shadow: -5px -5px 12px 0 rgba(255,255,255,1), 5px 5px 12px 0 rgba(174,174,192,0.65);
      overflow: hidden;
      transition: box-shadow 300ms ease-out, transform 300ms ease-out;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .contact-item:hover {
      box-shadow: -6px -6px 18px 0 rgba(255,255,255,1), 6px 6px 18px 0 rgba(174,174,192,0.8);
      transform: translateY(-2px) scale(1.03);
      transition: box-shadow 150ms ease, transform 150ms ease;
    }

    .contact-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      user-select: none;
    }

    .contact-label {
      flex: 1;
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.1;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .btn {
      width: 38px;
      height: 37px;
      background: var(--accent-orange);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #f0f0f2;
      pointer-events: none;
    }

    /* ── Mobile ────────────────────────────────────────────────────────────
       This page had no @media block at all, so phones inherited the desktop
       chrome: the 32px body padding band and the .container 1px border. With
       .overlay-topbar now removed from index.html there's also no bar to clear,
       so the panel fills the overlay window as one seamless opaque surface —
       same treatment as controls_open3d.html and about3d.html. */
    @media (max-width: 700px) {
      /* Hug the content vertically so the parent can shrink #contact-wrapper to
         fit (see the reporter script at the bottom of this file). The base rules
         pin html/body/.container to height:100%, which would keep the document a
         full viewport tall and defeat the measurement. */
      html, body {
        height: auto;
        min-height: 0;
        overflow: visible;
      }

      body { padding: 0; }

      .container {
        width: 100%;
        height: auto;
        border: none;
        padding: 28px 20px;
      }

      /* Desktop has `flex: 1` + `justify-content: center` so the three links
         spread over a wide, short box. In the tall, narrow mobile overlay that
         same rule stretched the list to full height and centred the links,
         leaving ~500px blank above them. Size to content and sit under the
         header instead — with the frame now hugging the content, the panel as a
         whole is what ends up centred on screen. */
      .contact-list {
        flex: 0 0 auto;
        justify-content: flex-start;
      }

      /* Row labels: clamp(16px, 2vw, 20px) resolves to its 16px floor at this
         width (2vw of 332px ≈ 6.6px), so they read noticeably smaller than the
         mobile menu's buttons. 22px matches .mobile-nav-btn in index.html
         exactly — these are the same kind of control, so they should be the
         same size. */
      .contact-label { font-size: 22px; }
    }
    /* Touch devices: shadows reduced 35% (offsets & blur ×0.65) to match the
       site-wide mobile scale. pointer:coarse (not a width query — this page
       lives in an iframe whose box width lies about the device). */
    @media (pointer: coarse) {
      .contact-item {
        box-shadow: -3.25px -3.25px 7.8px 0 rgba(255,255,255,1), 3.25px 3.25px 7.8px 0 rgba(174,174,192,0.65);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title" data-i18n="contact-title">CONTACT</h1>
      <hr class="header-divider" />
    </div>

    <div class="contact-list">

      <!-- target="_top" is REQUIRED here, unlike on contact2d.html which carries the
           identical markup and works. This page is only ever loaded inside the
           #contact-frame iframe in index.html, and without a target the mailto:
           navigation is aimed at the IFRAME. Desktop browsers still hand that off to
           the mail client, so it looks fine there — mobile Safari silently ignores an
           external-scheme navigation targeting a nested frame, and the tap does
           nothing at all. _top aims it at the top-level context instead, which every
           browser hands to the OS mail app.
           _top rather than _blank (which the two links below use): mailto: never
           actually unloads the page, so _blank would just strand an empty tab on iOS,
           whereas LinkedIn/Instagram are real pages that should open in one. -->
      <a href="#" id="email-link" target="_top" class="contact-item">
        <div class="contact-header">
          <span class="contact-label" data-i18n="label-email">Email</span>
          <div class="btn">↗</div>
        </div>
      </a>

      <a href="https://www.linkedin.com/in/lucas-maher-5b53163bb/" target="_blank" rel="noopener" class="contact-item">
        <div class="contact-header">
          <span class="contact-label">LinkedIn</span>
          <div class="btn">↗</div>
        </div>
      </a>

      <a href="https://www.instagram.com/lucas.maher.visuals" target="_blank" rel="noopener" class="contact-item">
        <div class="contact-header">
          <span class="contact-label">Instagram</span>
          <div class="btn">↗</div>
        </div>
      </a>

    </div>
  </div>

  <script>
    /* ── Email address built at runtime, not written as a literal mailto: in the
       page source ──────────────────────────────────────────────────────────
       The anchor ships with a placeholder href="#"; this is the FIRST script
       block in the file, running before the mailto _top handler below it,
       which needs a real mailto: href in place before it can do anything.
       This stops the overwhelming majority of spam-list bots, which harvest
       addresses by regexing raw HTML for an "@" or a "mailto:" prefix — with
       the address split into two variables, the raw source never contains
       either. It does nothing against a scraper that runs full JS, which is a
       much smaller and more targeted category; for that, only not publishing
       the address at all would help. No effect on real visitors, on either
       platform — the real href is in place well before the page is
       interactive, and the _top mailto handler below reads it fresh on click
       regardless of when it was set. */
    (function () {
      var user = 'lucas.maher.design', domain = 'gmail.com';
      var link = document.getElementById('email-link');
      if (link) link.href = 'mailto:' + user + '@' + domain;
    })();
  </script>

  <script>
    // ── i18n (EN + DE) ───────────────────────────────────────────
    (function () {
      var T = {
        de: { 'contact-title': 'KONTAKT', 'label-email': 'E-Mail' },
        en: { 'contact-title': 'CONTACT', 'label-email': 'Email' }
      };
      function apply(lang) {
        var t = T[lang] || T.en;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
      }
      apply(localStorage.getItem('lang') || 'de');
      window.addEventListener('storage', function (e) { if (e.key === 'lang') apply(e.newValue || 'de'); });
    })();
  </script>

  <script>
    /* ── mailto: has to be launched by the TOP document on mobile ───────────
       This page is only ever loaded inside #contact-frame in index.html. Mobile
       Safari drops an external-scheme navigation that originates in a nested
       frame — including one with target="_top" on the link — so tapping Email
       did nothing whatsoever. Desktop browsers hand it off either way, which is
       why the bug was mobile-only and invisible in testing.

       So: hand the URL up and let the parent navigate ITSELF. The call is a
       plain same-origin function call made synchronously inside the click
       handler, NOT postMessage — an async hop would land outside the user
       gesture and get blocked for a different reason.

       Everything here is defensive: if window.top is unreachable (a future
       cross-origin embed) or the helper is missing (this page opened directly,
       where window.top === window), we do nothing and the anchor's own
       target="_top" href runs as normal. preventDefault is called ONLY once the
       parent hand-off has actually happened, so there is no path where the tap
       is cancelled without something replacing it. */
    (function () {
      // Looked up by id, not by href^="mailto:" — the href is now built at
      // runtime by the script above rather than written in the HTML source
      // (see its comment), so matching on href content would depend on that
      // script having already run rather than on the plain element existing.
      var link = document.getElementById('email-link');
      if (!link) return;
      link.addEventListener('click', function (e) {
        if (window.top === window) return;              // opened directly — default is fine
        var fn;
        try { fn = window.top.openExternalScheme; }     // throws if cross-origin
        catch (err) { return; }
        if (typeof fn !== 'function') return;
        e.preventDefault();
        fn(link.getAttribute('href'));
      });
    })();
  </script>

  <script>
    /* ── Report content height to the 3D-view parent ───────────────────────
       Identical to the reporter in about3d.html; the parent listener in
       index.html keys off `frame` to pick the wrapper, so this needs no parent
       change. An <iframe> has no content-based intrinsic height, so the parent
       cannot shrink #contact-wrapper to fit unless it's told.

       A ResizeObserver on .container catches first paint, the webfont swap and
       the language switch (DE labels wrap differently) in one place. Nothing
       here expands like About's accordion, but the observer costs nothing and
       keeps the two pages identical. */
    (function () {
      var el = document.querySelector('.container');
      if (!el || window.parent === window) return;
      var last = -1;
      function report() {
        var h = Math.ceil(el.getBoundingClientRect().height);
        if (h === 0 || h === last) return;   // 0 = not laid out yet; RO also fires on width-only changes
        last = h;
        window.parent.postMessage({ type: 'overlay-autoheight', frame: 'contact', height: h }, '*');
      }
      if (window.ResizeObserver) new ResizeObserver(report).observe(el);
      window.addEventListener('load', report);
      report();
    })();
  </script>
</body>
</html>
