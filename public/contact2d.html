<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lucasmaher.com</title>
  <script src="/analytics.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Roboto:wght@400;500&family=Roboto+Flex:wdth@100&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --text-tertiary: #c7c7cc;
      --accent-orange: #FF5C00;
      --border-color: #6f6f6f;

      --shadow-raised-sm: 5px 5px 12px rgba(174,174,192,0.65), -5px -5px 12px rgba(255,255,255,1);
      --shadow-raised: 8px 8px 18px rgba(174,174,192,0.65), -8px -8px 18px rgba(255,255,255,1);
      --shadow-pressed: inset 5px 5px 10px rgba(174,174,192,0.6), inset -5px -5px 10px rgba(255,255,255,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      /* clip (not hidden): prevents horizontal scroll without becoming a
         scroll container, which would break position:sticky descendants. */
      overflow-x: clip;
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: 'Roboto Flex', sans-serif;
      line-height: 1.6;
      /* Fluid outer padding: full clamp() ceiling (55px) at/above 1440px,
         shrinks linearly to exactly 0 by 860px — matches the vertical
         border-removal breakpoint below, so the disappearance is continuous
         instead of jumping straight from ~25px to 0. */
      padding: 0 clamp(0px, calc(9.483vw - 81.552px), 55px);
    }

    /* Desktop-only shrink cap: once the padded/bordered layout has fully
       collapsed (below 860px), stop reflowing further — narrowing the real
       browser window just clips the extra width (no horizontal scrollbar);
       vertical scroll is unaffected. pointer:fine + hover:hover targets
       mouse/trackpad devices specifically, so actual touchscreens (phones,
       tablets) are excluded and keep reflowing normally down to their real
       widths via the existing @media (max-width: 640px) rules below. */
    @media (hover: hover) and (pointer: fine) {
      html, body { min-width: 860px; }
    }

    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 140px;
      border: none;
      z-index: 10;
      pointer-events: auto;
      background: transparent;
      overflow: visible;
      transition: transform 300ms ease;
    }

    #top-bar.hide {
      transform: translateY(-220px);
    }

    .page-wrapper {
      padding-top: 12px;
      padding-bottom: 12px;
      border: 1px solid var(--border-color);
      margin: 12px auto;
      /* Cap the content card on wide monitors; page bg fills the sides.
         Only bites above ~1550px — 13"/14" MacBooks stay edge-to-edge. */
      max-width: 1440px;
      overflow: hidden;
      /* Fill the frame vertically — the rim runs from near the top to near
         the bottom (slight 12px gap top/bottom via the margin) — and centre
         the header + buttons in the middle of it. */
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Contact Section */
    .contact-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      /* symmetric vertical padding so the wrapper centres the content truly */
      padding: 32px clamp(20px, 6vw, 80px);
    }

    .content {
      width: min(644px, 100%);
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(32px, 5vw, 56px);
      line-height: 1;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .dot-divider {
      width: 100%;
      height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: space no-repeat;
    }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* `backwards`, NOT `forwards` — this is what makes :hover work at all.
       `forwards` keeps asserting the final keyframe (`transform: translateY(0)`)
       forever after the animation ends, and CSS animations outrank normal
       declarations in the cascade, so it silently beat `:hover { transform }`
       — the lift never applied and only the shadow changed, which read as a
       flicker. `backwards` still applies the `from` keyframe during
       animation-delay (so the staggered fade-in is unchanged), but releases
       transform/opacity once finished, leaving :hover free to take over. */
    .anim { animation: fadeUp 350ms ease backwards; }
    .anim-1 { animation-delay: 0ms; }
    .anim-2 { animation-delay: 150ms; }
    .anim-3 { animation-delay: 300ms; }
    .anim-4 { animation-delay: 450ms; }

    /* .contact-item ported directly from contact3d.html's working version —
       same overflow:hidden + transition/hover treatment as the 3D nav buttons
       the user pointed to as correct, instead of the old .footer-logo-matched
       "big lift" hover. Font-size/dimensions below are kept at the 2D page's
       own fixed values (not 3D's clamp()) so the button size is unchanged. */
    .contact-item {
      background: var(--bg-surface);
      border-radius: 999px;
      box-shadow: -5px -5px 12px 0 rgba(255,255,255,1), 5px 5px 12px 0 rgba(174,174,192,0.65);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: box-shadow 300ms ease-out, transform 300ms ease-out;
    }

    /* Only works because the .anim fade-in sits on a WRAPPER div, not on this
       element — see the markup comment below. */
    .contact-item:hover {
      box-shadow: -6px -6px 18px 0 rgba(255,255,255,1), 6px 6px 18px 0 rgba(174,174,192,0.8);
      transform: translateY(-2px) scale(1.03);
      transition: box-shadow 150ms ease, transform 150ms ease;
    }

    .contact-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      user-select: none;
    }

    .contact-label {
      flex: 1;
      font-family: 'VT323', monospace;
      font-size: 20px;
      line-height: 1.1;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .btn {
      width: 38px;
      height: 37px;
      background: var(--accent-orange);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #f0f0f2;
      pointer-events: none;
    }

    /* ── Mobile layout ───────────────────────────────────────── */
    /* Endpoint of the fluid shrink above: padding is already 0 by here via
       the clamp(), but the page-wrapper's own border/margin need an explicit
       cut — a 1px border can't fade gradually, so it's removed outright at
       the exact width the padding hits zero, which reads as continuous. */
    @media (max-width: 860px) {
      html, body { padding: 0; }
      .page-wrapper {
        margin: 0;
        border-left: none;
        border-right: none;
      }
    }

    @media (max-width: 640px) {
      .page-wrapper { padding-top: 90px; }
      #top-bar { height: 140px; }
      #top-bar.hide { transform: translateY(-90px); }
    }

    /* ── Mobile menu overlay ─────────────────────────────────── */
    .mobile-menu {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      opacity: 0; pointer-events: none; transition: opacity 250ms ease;
    }
    .mobile-menu.open { opacity: 1; pointer-events: auto; }
    .mobile-menu-panel {
      width: 64%;
      background: var(--bg-surface);
      border-radius: 28px;
      /* No outer shadow/highlight — a neumorphic glow would read as a halo
         against the darkened backdrop. Depth lives on the buttons inside. */
      padding: 20px; display: flex; flex-direction: column; gap: 24px;
      transform: translateY(10px); transition: transform 250ms ease;
    }
    .mobile-menu.open .mobile-menu-panel { transform: translateY(0); }
    .mobile-view-toggle {
      display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
      background: var(--bg-surface); border-radius: 9999px;
      box-shadow: var(--shadow-raised-sm);
      padding: 5px;
    }
    /* Mobile menu only: extra breathing room under the 2D/3D toggle so it reads as
       its own control rather than as the first item of the Craft/About/Contact
       stack below it. Sits on top of the panel's uniform 24px gap.
       :first-child scopes this to the 2D/3D toggle specifically — .mobile-lang-toggle
       reuses the same .mobile-view-toggle class but is the panel's LAST child, so it
       keeps the plain 24px and the two toggles do not drift apart. */
    .mobile-menu-panel > .mobile-view-toggle:first-child { margin-bottom: 22px; }

    .mobile-mode-btn {
      border: none; background: transparent; border-radius: 9999px;
      padding: 11px 0; font-family: 'VT323', monospace; /* Matched to .mobile-nav-btn: same 22px VT323 and the same inherited 1.6
         line-height, so a segment's text box is identical to a nav button's. The
         segment keeps 11px vertical padding, which is exactly what makes the TRACK
         come out level with a nav button: the track adds its own 5px padding top and
         bottom, so 5+11 and 11+5 sum to the nav button's 16px — the two pills end up
         the same height without hardcoding one. line-height is stated explicitly
         because these are <button>s, which do not reliably inherit it. */
      font-size: 22px;
      line-height: 1.6;
      color: #555; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 150ms ease, color 150ms ease, transform 150ms ease;
    }
    .mobile-mode-btn.is-active {
      /* Shared by BOTH toggles: the selected segment is a recessed well. The inset is
         --shadow-pressed's 5px offset / 10px blur reduced 35%, matching the desktop nav's
         .pill__seg.is-active in top_row_permanent_V3.html. Scoped to the segments INSIDE
         the toggle — .mobile-view-toggle's own raised track shadow is untouched, mirroring
         the desktop .pill track.
         background must be a real colour, NOT transparent: an inset shadow paints over the
         element's own background, so without one the segment would read as a hole punched
         through to the track rather than a well.
         Deliberately sets NO color — selecting a segment must not darken its text, so both
         toggles keep the base #555 and the inset alone marks the language selection. */
      background: var(--bg-surface);
      box-shadow: inset 3.25px 3.25px 6.5px rgba(174, 174, 192, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 255, 255, 1);
    }

    /* 2D/3D toggle ONLY: a flat orange fill, and explicitly NO inset — the neumorphic
       shading and white highlight are cancelled here so the orange reads as a solid pill.
       The language toggle shares .mobile-view-toggle / .mobile-mode-btn and keeps both the
       surface fill and the inset from the rule above.
       Matched on [data-mode] rather than child position or the .mobile-lang-toggle class,
       so the orange cannot wander onto the wrong control if the panel is reordered — the
       language segments carry [data-lang] instead. Specificity (0,3,0) beats the shared
       rule, so source order does not matter.
       --accent-orange is undefined on index.html (the 3D page declares no such custom
       property), hence the literal fallback. */
    .mobile-mode-btn[data-mode].is-active {
      background: var(--accent-orange, #FF5C00);
      /* Black, overriding the base rule's #555. That grey is tuned for an UNSELECTED
         segment on the grey surface; over #FF5C00 it measures 2.4:1 and the label reads
         as disabled rather than selected. Black on this orange is 6.8:1. Scoped to
         [data-mode], so the language segments keep #555 on their grey well. */
      color: #000;
      /* Same well as the language toggle above — same offsets, same blur, same
         alphas — recoloured so it reads on orange instead of on the grey
         surface. The grey/white pair was built to sit on #DCDCE3; over #FF5C00
         a white highlight desaturates to a pale wash and the cool grey shadow
         reads as dirt. So the two hues are re-derived from the orange itself:
         top-left gets a darker orange, bottom-right a lighter one, keeping the
         site's light-from-top-left convention. */
      box-shadow: inset 3.25px 3.25px 6.5px rgba(168, 56, 0, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 173, 122, 1);
    }
    .mobile-mode-btn:active:not(.is-active) {
      /* Scale is the tap feedback both toggles share. */
      transform: scale(0.96);
    }

    /* Press inset for the LANGUAGE toggle only. A tap should preview the state it lands
       in: a language segment lands in an inset well, but a 2D/3D segment now lands in a
       flat orange pill, so flashing an inset there would animate to something that no
       longer exists in that control. Same reduced spread as the settled state. */
    .mobile-mode-btn[data-lang]:active:not(.is-active) {
      box-shadow: inset 3.25px 3.25px 6.5px rgba(174, 174, 192, 0.6), inset -3.25px -3.25px 6.5px rgba(255, 255, 255, 1);
    }
    .mobile-nav-btn {
      display: block; background: var(--bg-surface); border-radius: 9999px;
      box-shadow: var(--shadow-raised-sm);
      padding: 16px 24px; font-family: 'VT323', monospace; font-size: 22px;
      color: #555; text-transform: uppercase; text-decoration: none;
      text-align: center; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: box-shadow 150ms ease, transform 150ms ease;
    }
    .mobile-nav-btn.is-active {
      box-shadow: var(--shadow-pressed);
      color: #000;
    }
    .mobile-nav-btn:active {
      transform: scale(0.98);
      box-shadow: var(--shadow-pressed);
    }

    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    #scroll-track {
      position: fixed; right: 16px; top: 24px; bottom: 24px;
      width: 6px; z-index: 999; pointer-events: none;
      transform: translateZ(0); will-change: transform;
    }
    /* Mobile only: sit the scroll dots closer to the screen edge. Same
       specificity as the rule above, so this wins purely on source order —
       keep it immediately after. Desktop keeps right: 16px. */
    @media (max-width: 640px) {
      #scroll-track { right: 6px; }
    }
    #scroll-thumb {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; gap: 5px;
    }
    .scroll-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--accent-orange, #FF5C00); display: block; flex-shrink: 0;
    }
    /* ── Reduced motion (apple-design §14): drop non-essential movement,
       keep layout + opacity cues. No effect unless the OS pref is set. */
    @media (prefers-reduced-motion: reduce) {
      .accent-dot { animation: none !important; opacity: 1; }
      .machine-overlay-btn,
      .hero-blob,
      .character-row,
      .spin-scrolly .spin { animation: none !important; }
      .project-nav-item:hover,
      .meta-tile:hover,
      .project-tile:hover,
      .machine-frame-wrap:hover,
      .tag:hover { transform: none !important; }
    }

    /* Wide-aspect monitors only (not the ~1.6 MacBook ratio): pull the card
       in a bit more for extra breathing room. Nav keeps its own width.
       17/10 not 1.7 — Safari ignores the decimal aspect form. */
    @media (min-aspect-ratio: 17/10) {
      .page-wrapper { max-width: 1390px; }
    }
    /* Mobile: neumorphic shadow spread/radius reduced 35% (offsets & blur ×0.65),
       matching the nav's 2D/3D toggle segment. Tokens for the var() users, plus
       this page's hardcoded contact-button shadow. Desktop untouched. */
    @media (max-width: 640px) {
      :root {
        --shadow-raised-sm: 3.25px 3.25px 7.8px rgba(174,174,192,0.65), -3.25px -3.25px 7.8px rgba(255,255,255,1);
        --shadow-raised: 5.2px 5.2px 11.7px rgba(174,174,192,0.65), -5.2px -5.2px 11.7px rgba(255,255,255,1);
        --shadow-pressed: inset 3.25px 3.25px 6.5px rgba(174,174,192,0.6), inset -3.25px -3.25px 6.5px rgba(255,255,255,1);
      }
      .contact-item {
        box-shadow: -3.25px -3.25px 7.8px 0 rgba(255,255,255,1), 3.25px 3.25px 7.8px 0 rgba(174,174,192,0.65);
      }
    }
  </style>
</head>
<body>
  <iframe id="top-bar" src="/top_row_permanent_V3.html" allowtransparency="true" scrolling="no"></iframe>

  <div id="mobile-menu" class="mobile-menu">
    <div class="mobile-menu-panel">
      <a class="mobile-nav-btn" data-page="craft" data-i18n="menu-craft">Craft</a>
      <a class="mobile-nav-btn" data-page="about" data-i18n="menu-about">About</a>
      <a class="mobile-nav-btn is-active" data-page="contact" data-i18n="menu-contact">Contact</a>
      <!-- Language toggle. Deliberately the SAME component as the 2D/3D toggle
           above — same two classes, no styling of its own — so the pair can
           never drift apart. The nav bar's own de/en text is hidden below
           640px; this replaces it. -->
      <div class="mobile-view-toggle mobile-lang-toggle">
        <button class="mobile-mode-btn" data-lang="de">Deutsch</button>
        <button class="mobile-mode-btn" data-lang="en">English</button>
      </div>
    </div>
  </div>

  <div class="page-wrapper">
    <div class="contact-section">
      <div class="content">

        <div class="title-block anim anim-1">
          <h1 class="contact-title" data-i18n="contact-title">Get In Touch</h1>
          <div class="dot-divider"></div>
        </div>

        <div class="contact-list">

          <!-- The .anim fade-in lives on a WRAPPER, never on .contact-item itself.
               A CSS animation that targets `transform` keeps ownership of that
               property in Safari even after it finishes, which suppresses the
               `transition` on .contact-item:hover — the lift then snapped
               instantly while the shadow eased, reading as a flicker. Keeping
               the animation and the hover on two different elements makes the
               conflict structurally impossible. Do not merge them back. -->
          <div class="anim anim-2">
            <a href="#" id="email-link" class="contact-item">
              <div class="contact-header">
                <span class="contact-label" data-i18n="label-email">Email</span>
                <div class="btn">↗</div>
              </div>
            </a>
          </div>

          <div class="anim anim-3">
            <a href="https://www.linkedin.com/in/lucas-maher-5b53163bb/" target="_blank" rel="noopener" class="contact-item">
              <div class="contact-header">
                <span class="contact-label">LinkedIn</span>
                <div class="btn">↗</div>
              </div>
            </a>
          </div>

          <div class="anim anim-4">
            <a href="https://www.instagram.com/lucas.maher.visuals" target="_blank" rel="noopener" class="contact-item">
              <div class="contact-header">
                <span class="contact-label">Instagram</span>
                <div class="btn">↗</div>
              </div>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    /* ── Email address built at runtime, not written as a literal mailto: in the
       page source ──────────────────────────────────────────────────────────
       The anchor ships with a placeholder href="#"; this is the FIRST script
       block in the file (script execution order matters here, not just
       DOMContentLoaded timing) so it runs before anything else touches the
       link, including the click handlers further down.
       This stops the overwhelming majority of spam-list bots, which harvest
       addresses by regexing raw HTML for an "@" or a "mailto:" prefix — with
       the address split into two variables, the raw source never contains
       either. It does nothing against a scraper that runs full JS, which is a
       much smaller and more targeted category; for that, only not publishing
       the address at all would help. No effect on real visitors — the real
       href is in place well before the page is interactive. */
    (function () {
      var user = 'lucas.maher.design', domain = 'gmail.com';
      var link = document.getElementById('email-link');
      if (link) link.href = 'mailto:' + user + '@' + domain;
    })();
  </script>

  <script>
    // ── Page transitions ──────────────────────────────────────────
    (function() {
      var KF = '@keyframes _sR{from{transform:translateX(100%)}to{transform:translateX(0)}}@keyframes _sL{from{transform:translateX(-100%)}to{transform:translateX(0)}}';
      var s = document.createElement('style'); s.textContent = KF; document.head.appendChild(s);
      var DUR = 380, EASE = 'cubic-bezier(0.4,0,0.2,1)';

      function _getWrap() {
        var w = document.getElementById('_sw');
        if (!w) {
          w = document.createElement('div'); w.id = '_sw';
          Array.from(document.body.children).forEach(function(c) {
            if (c.id !== 'top-bar' && c.id !== '_sw') w.appendChild(c);
          });
          document.body.appendChild(w);
        }
        return w;
      }

      var _rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var dir = sessionStorage.getItem('_sv');
      if (dir) sessionStorage.removeItem('_sv');
      if (dir && !_rm) {
        var wrap = _getWrap();
        wrap.style.transform = dir === 'right' ? 'translateX(100%)' : 'translateX(-100%)';
        var done = false;
        function reveal() {
          if (done) return; done = true;
          requestAnimationFrame(function() {
            wrap.style.transform = '';
            wrap.style.animation = (dir === 'right' ? '_sR' : '_sL') + ' ' + DUR + 'ms ' + EASE + ' both';
            setTimeout(function() { wrap.style.animation = ''; }, DUR + 60);
          });
        }
        if (document.fonts && document.fonts.ready) { document.fonts.ready.then(reveal); } else { requestAnimationFrame(function() { requestAnimationFrame(reveal); }); }
        setTimeout(reveal, 300);
      }

      window._nav = function(url, into) {
        sessionStorage.setItem('_sv', into);
        var dim = document.createElement('div');
        dim.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0);z-index:9999;transition:background 220ms ease;pointer-events:none;';
        document.body.appendChild(dim);
        requestAnimationFrame(function() { dim.style.background = 'rgba(0,0,0,0.28)'; });
        setTimeout(function() { location.href = url; }, 220);
      };

      window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'page-slide') window._nav(e.data.url, e.data.enterFrom);
      });
    })();

    (function () {
      const menu = document.getElementById('mobile-menu');
      /* The mobile menu is an opaque neumorphic panel using the site's own
         surface colour and shadow tokens, so it no longer adapts its shading
         to the page behind it (that was needed only for the old glass look). */
      function openMenu()  { menu.classList.add('open'); }
      function closeMenu() { menu.classList.remove('open'); }
      window.addEventListener('message', e => {
        if (e.data.type === 'mobile-menu-toggle')
          menu.classList.contains('open') ? closeMenu() : openMenu();
      });
      menu.addEventListener('click', e => { if (e.target === menu) closeMenu(); });
      menu.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.mode === '3d') window._nav('/', 'right');
          else window.location.href = '/2D.html';
        });
      });
      menu.querySelectorAll('[data-page]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault(); closeMenu();
          if      (btn.dataset.page === 'craft')   window.location.href = '/2D.html#craft-section';
          else if (btn.dataset.page === 'about')   window.location.href = '/about2d.html';
          else if (btn.dataset.page === 'contact') window.location.href = '/contact2d.html';
        });
      });

      // Language toggle. It does NOT translate this page directly — it writes
      // the preference and hands the change to the nav iframe, which is already
      // the site's single owner of language and broadcasts 'lang-change' back to
      // the handler this page has always had. One path, so nothing desyncs.
      const langBtns = menu.querySelectorAll('[data-lang]');
      function markLang(l) {
        langBtns.forEach(b => b.classList.toggle('is-active', b.dataset.lang === l));
      }
      // Seed the highlight synchronously; the nav also broadcasts the stored
      // language ~100ms after it loads, which corrects a stale value (e.g. an
      // old 'fr' preference, which the nav rewrites to 'en').
      try { markLang(localStorage.getItem('lang') || 'de'); } catch (e) { markLang('de'); }
      langBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const l = btn.dataset.lang;
          try { localStorage.setItem('lang', l); } catch (e) {}
          markLang(l);
          const bar = document.getElementById('top-bar');
          if (bar && bar.contentWindow) bar.contentWindow.postMessage({ type: 'lang-change', lang: l }, '*');
        });
      });
      window.addEventListener('message', e => {
        if (e.data && e.data.type === 'lang-change') markLang(e.data.lang);
      });
    })();

    let lastScrollY = 0;
    let lastToggleY = 0;
    const topBar = document.getElementById('top-bar');
    const hideThreshold = 250;
    const showThreshold = 180;

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      if (currentScrollY === 0) {
        topBar.classList.remove('hide');
        lastToggleY = 0;
      } else if (currentScrollY > lastScrollY && Math.abs(currentScrollY - lastToggleY) > hideThreshold) {
        topBar.classList.add('hide');
        lastToggleY = currentScrollY;
      } else if (currentScrollY < lastScrollY && Math.abs(currentScrollY - lastToggleY) > showThreshold) {
        topBar.classList.remove('hide');
        lastToggleY = currentScrollY;
      }
      lastScrollY = currentScrollY;
    });

    // ── i18n ─────────────────────────────────────────────────────
    const TRANSLATIONS = {
      en: {
        'contact-title': 'Get In Touch',
        'label-email': 'Email',
        'menu-craft': 'Craft', 'menu-about': 'About', 'menu-contact': 'Contact',
      },
      de: {
        'contact-title': 'Kontakt aufnehmen',
        'label-email': 'E-Mail',
        'menu-craft': 'Projekte', 'menu-about': 'Über mich', 'menu-contact': 'Kontakt',
      }
    };
    function applyLang(lang) {
      const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
      document.querySelectorAll('[data-i18n]').forEach(el => { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
    }
    applyLang(localStorage.getItem('lang') || 'de');

    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      if (e.data.type === 'nav-expand') topBar.style.height = '400px';
      if (e.data.type === 'nav-collapse') topBar.style.height = '140px';
      if (e.data.type === 'lang-change') applyLang(e.data.lang);
    });
  </script>
  <div id="scroll-track">
    <div id="scroll-thumb">
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
      <span class="scroll-dot"></span>
    </div>
  </div>
  <script>
    (function () {
      var thumb = document.getElementById('scroll-thumb');
      var track = document.getElementById('scroll-track');
      var ticking = false;
      function update() {
        var scrolled  = window.scrollY;
        var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        var progress  = maxScroll > 0 ? Math.max(0, Math.min(1, scrolled / maxScroll)) : 0;
        thumb.style.top = (progress * (track.offsetHeight - thumb.offsetHeight)) + 'px';
        ticking = false;
      }
      window.addEventListener('scroll', function () {
        if (!ticking) { requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
      update();
    })();
  </script>

  <script>
    // Dot-divider exact-tiling fix: background-repeat:space is unreliable on
    // gradient backgrounds in Safari (last dot can render half-clipped even
    // though space is supposed to guarantee whole tiles). Root-cause fix:
    // measure each divider's real width in JS and set background-size to an
    // EXACT integer divisor of it, so there is no remainder tile left for
    // any browser's tiling engine to mishandle.
    (function () {
      function fixDotDividers() {
        document.querySelectorAll('.dot-divider').forEach(function (el) {
          var w = el.offsetWidth;
          if (!w) return;
          var count = Math.max(2, Math.round(w / 10));
          var tile = w / count;
          el.style.backgroundSize = tile + 'px 4px';
          el.style.backgroundRepeat = 'repeat-x';
        });
      }
      var raf;
      function scheduleFix() {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(fixDotDividers);
      }
      document.addEventListener('DOMContentLoaded', scheduleFix);
      window.addEventListener('load', scheduleFix);
      window.addEventListener('resize', scheduleFix);
    })();
  </script>
  <script>
    // Mobile only: pixel-snap the card's BOTTOM border.
    //
    // .page-wrapper's border-bottom is the last painted row of the entire document, and
    // the document does not end on a whole pixel. Measured on a 390px phone: the
    // wrapper's border-box bottom sits at y = 5585.078 while documentElement.scrollHeight
    // is 5585 — so the final 0.078px of that 1px border falls outside the scrollable
    // area. .project-nav's border-top, the line at the TOP of the same section, has
    // ordinary content above and below it and sits at no boundary at all. That asymmetry
    // is why only the bottom line reads as thin/clipped. Blink happens to snap both to a
    // clean 3 device rows (verified at DPR 3: identical ink, 328.5 each), so this does
    // NOT reproduce in Chrome — WebKit is under no obligation to make the same choice.
    //
    // Fix: measure the real fractional bottom and grow padding-bottom by exactly enough
    // to land it on a whole CSS pixel, so the border fills an exact device-pixel band
    // with nothing hanging past the end of the document. Same measure-then-set approach
    // as the dot-divider fix above, and for the same reason: a static CSS value cannot
    // know where the box happens to land. The added padding is always < 1px, and it sits
    // below .project-nav (whose -12px margin cancels the base 12px), so nothing moves
    // visibly.
    //
    // Desktop is untouched — outside the mobile query the inline value is cleared and
    // the stylesheet's own padding-bottom applies.
    (function () {
      var wrap = document.querySelector('.page-wrapper');
      if (!wrap) return;
      var mq = window.matchMedia('(max-width: 640px)');
      function snap() {
        wrap.style.paddingBottom = '';        // always measure against the CSS value
        if (!mq.matches) return;              // desktop: leave the stylesheet alone
        var bottom = wrap.getBoundingClientRect().bottom + window.pageYOffset;
        var delta = Math.ceil(bottom) - bottom;
        if (delta > 0.002) {
          var base = parseFloat(getComputedStyle(wrap).paddingBottom) || 0;
          wrap.style.paddingBottom = (base + delta).toFixed(3) + 'px';
        }
      }
      var raf;
      function scheduleSnap() { cancelAnimationFrame(raf); raf = requestAnimationFrame(snap); }
      document.addEventListener('DOMContentLoaded', scheduleSnap);
      window.addEventListener('load', scheduleSnap);
      window.addEventListener('resize', scheduleSnap);
      if (mq.addEventListener) mq.addEventListener('change', scheduleSnap);
    })();
  </script>
