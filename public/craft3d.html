<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/site/favicon-32.png" />
  <link rel="apple-touch-icon" href="/images/site/favicon-180.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Craft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'OCR-A-BT';
      src: url('/OCR-A-BT.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-base: #DCDCE3;
      --bg-surface: #DCDCE3;
      --text-primary: #1A1A1A;
      --text-secondary: #8E8E93;
      --accent-orange: #FF5C00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: var(--bg-base); font-family: 'VT323', monospace; padding: 32px; display: flex; justify-content: center; }

    .container {
      width: min(100%, 804px);
      max-width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: clamp(32px, 5vw, 64px) clamp(32px, 8vw, 80px);
      gap: 16px;
      border: 1px solid #6f6f6f;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .header-title {
      font-family: 'OCR-A-BT', monospace;
      font-size: clamp(36px, 5.6vw, 56px);
      color: var(--text-primary);
      letter-spacing: 6px;
    }

    .header-divider {
      width: 100%;
      height: 4px;
      background-image: radial-gradient(circle, var(--text-primary) 1.5px, transparent 1.5px);
      background-size: 10px 4px;
      background-repeat: space no-repeat;
      border: none;
    }

    .craft-hint {
      font-family: 'VT323', monospace;
      font-size: clamp(26px, 3.2vw, 32px);
      color: var(--text-primary);
      padding: 8px 16px;
      margin-top: clamp(32px, 6vh, 60px);
    }

    .contact-item {
      background: var(--bg-surface);
      border-radius: 999px;
      box-shadow: -5px -5px 12px 0 rgba(255,255,255,1), 5px 5px 12px 0 rgba(174,174,192,0.65);
      overflow: hidden;
      transition: box-shadow 300ms ease-out, transform 300ms ease-out;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .contact-item:hover {
      box-shadow: -6px -6px 18px 0 rgba(255,255,255,1), 6px 6px 18px 0 rgba(174,174,192,0.8);
      transform: translateY(-2px) scale(1.03);
      transition: box-shadow 150ms ease, transform 150ms ease;
    }

    .contact-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 16px;
      user-select: none;
    }

    .contact-label {
      flex: 1;
      font-family: 'VT323', monospace;
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.1;
      color: var(--text-primary);
      text-transform: uppercase;
    }

    .btn {
      width: 38px;
      height: 37px;
      background: var(--accent-orange);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'VT323', monospace;
      font-size: 22px;
      color: #f0f0f2;
      pointer-events: none;
    }

    /* ── Mobile ────────────────────────────────────────────────────────────
       This page had no @media block at all, so phones got the full desktop
       chrome: the 32px body padding band, the .container 1px border, and a
       header sitting 65px down instead of the 28px used by the other overlays.

       min-height PINS the frame instead of letting it hug the content. This page
       is only a header plus one hint line (~150px), so hugging would make its
       overlay visibly smaller than About's and Contact's. 340px matches Über
       mich's measured height so the panels read as one consistent size — this is
       the one number to edit if that reference height ever changes. */
    @media (max-width: 700px) {
      html, body {
        height: auto;
        min-height: 0;
        overflow: visible;
      }

      body { padding: 0; }

      .container {
        width: 100%;
        height: auto;
        min-height: 340px;
        border: none;
        padding: 28px 20px;
      }
    }
    /* Touch devices: shadows reduced 35% (offsets & blur ×0.65) to match the
       site-wide mobile scale. pointer:coarse (not a width query — this page
       lives in an iframe whose box width lies about the device). */
    @media (pointer: coarse) {
      .contact-item {
        box-shadow: -3.25px -3.25px 7.8px 0 rgba(255,255,255,1), 3.25px 3.25px 7.8px 0 rgba(174,174,192,0.65);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="header-title" data-i18n="craft-title">CRAFT</h1>
      <hr class="header-divider" />
    </div>

    <p class="craft-hint" data-i18n="craft-hint">walk around and explore :)</p>
  </div>

  <script>
    // ── i18n (EN + DE) ───────────────────────────────────────────
    (function () {
      var T = {
        de: { 'craft-title': 'PROJEKTE', 'craft-hint': 'lauf herum und entdecke :)' },
        en: { 'craft-title': 'CRAFT', 'craft-hint': 'walk around and explore :)' }
      };
      function apply(lang) {
        var t = T[lang] || T.en;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { if (t[el.dataset.i18n] !== undefined) el.textContent = t[el.dataset.i18n]; });
      }
      apply(localStorage.getItem('lang') || 'de');
      window.addEventListener('storage', function (e) { if (e.key === 'lang') apply(e.newValue || 'de'); });
    })();
  </script>

  <script>
    /* ── Report content height to the 3D-view parent ───────────────────────
       Same reporter as about3d / contact3d; the listener in index.html keys off
       `frame` to pick the wrapper, so no parent change is needed. Here the
       measured height is the 340px min-height floor rather than the real content
       height, which is exactly the intent — the frame stays the same size as the
       other overlays. */
    (function () {
      var el = document.querySelector('.container');
      if (!el || window.parent === window) return;
      var last = -1;
      function report() {
        var h = Math.ceil(el.getBoundingClientRect().height);
        if (h === 0 || h === last) return;
        last = h;
        window.parent.postMessage({ type: 'overlay-autoheight', frame: 'craft', height: h }, '*');
      }
      if (window.ResizeObserver) new ResizeObserver(report).observe(el);
      window.addEventListener('load', report);
      report();
    })();
  </script>
</body>
</html>
